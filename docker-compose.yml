networks:
  etl_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # 1. Base de Datos (PostgreSQL 15)
  postgres-db:
    image: postgres:15-alpine
    container_name: etl-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_monitor_db}
      POSTGRES_USER: ${POSTGRES_USER:-monitor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - etl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d price_monitor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Servidor API REST (Java Spring Boot)
  backend-api:
    build:
      context: ./price-monitor-backend
      dockerfile: Dockerfile
    container_name: etl-spring-backend
    ports:
      - "8085:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/price_monitor_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-monitor_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-local-dev-password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SERVER_PORT=8080
      - APP_SECURITY_API_KEY=${API_KEY:-local-dev-api-key}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - etl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      disable: true # Desactivado por defecto si no añadimos Spring Actuator, pero se incluye para completitud en producción

  # 3. Orquestador de Extracción (Scraper Python + Chrome Headless)
  scraper-service:
    build:
      context: ./price-monitor-scraper
      dockerfile: Dockerfile
    container_name: etl-python-scraper
    environment:
      - BACKEND_API_URL=http://backend-api:8080/api/v1/etl/ingest
      - API_KEY=${API_KEY:-local-dev-api-key}
      - HEADLESS_SCRAPE=True
    depends_on:
      - backend-api
    networks:
      - etl_network
