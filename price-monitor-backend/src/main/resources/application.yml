server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/price_monitor_db}
    username: ${SPRING_DATASOURCE_USERNAME:monitor_user}
    password: ${SPRING_DATASOURCE_PASSWORD:SecretProductionPassword2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Valida contra nuestro DDL cargado en init.sql
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: etl-async-task-
